<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Room Tech Status | Davis Tech Support</title>
<meta name="description" content="See which classroom tech is working, and report a problem in seconds.">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="assets/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F3F5F9;--card:#fff;--ink:#132033;--muted:#5D6B7E;--line:#E1E6EE;--nav:#14213D;--nav2:#1F3157;--accent:#E8453C;--accent-d:#C9362E;--focus:#3E6FD8;
 --ok:#16A06A;--ok-bg:#E3F6EE;--issue:#D18A0F;--issue-bg:#FFF3DA;--down:#E0433A;--down-bg:#FDE7E6;--repair:#2F6FEB;--repair-bg:#E4EDFF;--r:14px;--sh:0 1px 2px rgba(19,32,51,.05),0 6px 18px rgba(19,32,51,.06)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Inter","IBM Plex Sans",system-ui,sans-serif}
a{color:var(--focus)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .94rem/1 inherit;font-family:inherit;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:42px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#BAC4D2}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(62,111,216,.3);border-color:var(--focus)}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}.btn.red:hover{background:var(--accent-d)}
.btn.dk{background:var(--nav);border-color:var(--nav);color:#fff}.btn.dk:hover{background:var(--nav2)}
.btn.sm{padding:7px 11px;min-height:34px;font-size:.86rem}.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55;cursor:default}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
label.l{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
.chk{display:flex;gap:9px;align-items:center;font-weight:500;cursor:pointer}.chk input{width:18px;height:18px;margin:0}
.err{color:var(--down);font-size:.92rem;margin:10px 0 0;min-height:1.2em}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1000px 600px at 20% -10%,#24406F,transparent 60%),var(--nav)}
.auth .box{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:28px 28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.auth .brand img{height:52px}
.auth h1{font-size:1.35rem;margin:0}.auth .brand span{color:var(--muted);font-size:.88rem}
.auth h2{font-size:1.1rem;margin:4px 0 2px}
.auth .btn.full{width:100%;margin-top:18px}
.auth .alt{margin-top:16px;text-align:center;font-size:.9rem;color:var(--muted)}.auth .alt button{background:none;border:0;color:var(--focus);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
/* ---------- shell ---------- */
header.top{background:var(--nav);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.in{max-width:1280px;margin:0 auto;padding:0 20px}
.top .in{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.top img{height:36px}.top .sch{font-weight:700;font-size:1.02rem;line-height:1.15}.top .sch small{display:block;color:#9FB2D0;font-weight:500;font-size:.78rem}
nav.tabs{display:flex;gap:4px;margin-left:10px;flex-wrap:wrap}
nav.tabs a{color:#C7D3E8;text-decoration:none;font-weight:600;font-size:.93rem;padding:8px 12px;border-radius:9px;position:relative}
nav.tabs a:hover{background:var(--nav2);color:#fff}nav.tabs a[aria-current]{background:#fff;color:var(--nav)}
nav.tabs .dotn{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--nav)}
.top .sp{flex:1}
.top .btn{background:transparent;color:#fff;border-color:#33466E}.top .btn.red{background:var(--accent);border-color:var(--accent)}
.me{position:relative}.me>button{background:var(--nav2);border:0;color:#fff;border-radius:99px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;font:600 .9rem inherit;font-family:inherit;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;background:#3E6FD8;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.2);min-width:220px;padding:6px;display:none}
.menu.on{display:block}.menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:.88rem;color:var(--muted)}.menu .who b{display:block;color:var(--ink);font-size:.95rem}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font:500 .93rem inherit;font-family:inherit;cursor:pointer;color:var(--ink)}.menu button:hover{background:var(--bg)}
main{padding:22px 0 60px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:1.5rem;letter-spacing:-.01em}.ph p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.banner{border-radius:var(--r);padding:14px 16px;margin-bottom:16px;background:var(--repair-bg);color:#1B3E8A}.banner.bad{background:var(--down-bg);color:#8A1F19}
/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.stat .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}.stat .si svg{width:24px;height:24px}
.stat b{display:block;font-size:1.6rem;line-height:1}.stat span{color:var(--muted);font-size:.86rem}
.stat[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),var(--sh)}
.s-down .si{background:var(--down-bg);color:var(--down)}.s-issue .si{background:var(--issue-bg);color:var(--issue)}.s-repair .si{background:var(--repair-bg);color:var(--repair)}.s-ok .si{background:var(--ok-bg);color:var(--ok)}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}.tools input[type=search]{flex:1;min-width:200px}.tools select{width:auto;min-width:160px}
/* ---------- rooms and device tiles ---------- */
.area-h{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:10px}.area-h::after{content:"";flex:1;height:1px;background:var(--line)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.room{padding:16px;position:relative;overflow:hidden}
.room::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--ok)}
.room.st-issue::before{background:var(--issue)}.room.st-down::before{background:var(--down)}.room.st-repair::before{background:var(--repair)}
.room.mine{box-shadow:0 0 0 2px var(--focus),var(--sh)}
.rh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.rh h3{margin:0;font-size:1.08rem}.rh .who{color:var(--muted);font-size:.84rem}
.rh .tag{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{appearance:none;font:inherit;color:inherit;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 8px 11px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#F7F9FC);transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(19,32,51,.1)}
.tile .nm{font-weight:600;font-size:.84rem;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .lb{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px}
.ico{position:relative;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;flex:none}
.ico svg{width:30px;height:30px}
.ico.cart .st{position:absolute;display:grid;place-items:center}.ico.cart .st svg{width:24px;height:24px}
.ico.cart .s1{transform:translate(-7px,4px)}.ico.cart .s2{transform:translate(0,0);opacity:.7}.ico.cart .s3{transform:translate(7px,-4px);opacity:.42}
.ico.cart .bolt{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}.ico.cart .bolt svg{width:14px;height:14px;color:#E2A400}
.t-ok .ico{background:var(--ok-bg);color:var(--ok)}.t-issue .ico{background:var(--issue-bg);color:var(--issue)}.t-down .ico{background:var(--down-bg);color:var(--down)}.t-repair .ico{background:var(--repair-bg);color:var(--repair)}
.t-ok .lb{background:var(--ok-bg);color:var(--ok)}.t-issue .lb{background:var(--issue-bg);color:#9A6300}.t-down .lb{background:var(--down-bg);color:var(--down)}.t-repair .lb{background:var(--repair-bg);color:var(--repair)}
.tile.t-down{border-color:#F4C2BE;background:linear-gradient(180deg,#fff,#FFF5F4)}.tile.t-issue{border-color:#F2DDA9}.tile.t-repair{border-color:#C5D6FB}
.badge{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff}.badge svg{width:12px;height:12px}
.t-ok .badge{background:var(--ok)}.t-issue .badge{background:var(--issue)}.t-down .badge{background:var(--down)}.t-repair .badge{background:var(--repair)}
.t-down .ico::after{content:"";position:absolute;inset:-4px;border-radius:19px;border:2px solid var(--down);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.7;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}
.radd{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.tile.add{border-style:dashed;color:var(--muted);background:transparent;justify-content:center}.tile.add .ico{background:var(--bg);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
/* ---------- tickets ---------- */
.tl{display:grid;gap:10px}
.trow{display:flex;gap:14px;align-items:center;padding:14px 16px;text-decoration:none;color:inherit}
.trow:hover{border-color:#BAC4D2}.trow .ico{width:46px;height:46px;border-radius:13px}.trow .ico svg{width:26px;height:26px}.trow .ico.cart .st svg{width:20px;height:20px}
.trow .tx{flex:1;min-width:0}.trow .tx b{display:block}.trow .tx p{margin:2px 0 0;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .meta{text-align:right;font-size:.82rem;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-open{background:var(--down-bg);color:var(--down)}.p-open.sev-issue{background:var(--issue-bg);color:#9A6300}.p-progress{background:var(--repair-bg);color:var(--repair)}.p-waiting{background:#EFE7FF;color:#6B3FD1}.p-fixed{background:var(--ok-bg);color:var(--ok)}
.unread{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:none;font:600 .9rem inherit;font-family:inherit;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted)}.seg button[aria-pressed=true]{background:var(--nav);color:#fff}
.tk{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}@media (max-width:900px){.tk{grid-template-columns:1fr}}
.tkh{display:flex;gap:14px;align-items:center}.tkh .ico{width:62px;height:62px;border-radius:17px}.tkh .ico svg{width:34px;height:34px}
.tkh h1{margin:0;font-size:1.3rem}.tkh p{margin:2px 0 0;color:var(--muted)}
.thread{display:grid;gap:12px;margin-top:18px}
.msg{max-width:85%;padding:11px 14px;border-radius:14px;background:var(--bg);white-space:pre-wrap;word-wrap:break-word}
.msg.mine{justify-self:end;background:#E7EEFF}.msg.staff{background:#EAF6F0}
.msg .by{font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:3px;display:flex;gap:8px;justify-content:space-between}
.msg.sys{justify-self:center;background:none;color:var(--muted);font-size:.86rem;padding:2px 8px;text-align:center}
.msg.first{background:#fff;border:1px solid var(--line);max-width:100%;justify-self:stretch}
.compose{display:flex;gap:10px;margin-top:16px;align-items:flex-end}.compose textarea{min-height:52px;height:52px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.93rem}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;word-break:break-word}
.side h3{margin:0 0 10px;font-size:1rem}.side .btns{display:grid;gap:8px;margin-top:10px}
/* ---------- tables ---------- */
table.t{width:100%;border-collapse:collapse;font-size:.93rem}table.t th,table.t td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}table.t th{color:var(--muted);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
.role{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg)}.role.admin{background:#FDE7E6;color:#A12A22}.role.tech{background:var(--repair-bg);color:var(--repair)}
.off{opacity:.5}
/* ---------- dialogs ---------- */
dialog{border:0;border-radius:18px;padding:0;max-width:600px;width:calc(100% - 24px);box-shadow:0 24px 70px rgba(0,0,0,.3);color:var(--ink)}
dialog.wide{max-width:820px}
dialog::backdrop{background:rgba(19,32,51,.55)}
.dlg{padding:22px 22px 20px}.dlg h2{margin:0 0 4px;font-size:1.25rem}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.sev{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sev label{margin:0;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:600}
.sev label:has(input:checked){border-color:var(--ink);background:var(--bg)}.sev input{width:auto;margin-top:4px}.sev small{display:block;font-weight:400;color:var(--muted)}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.typegrid label{margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:12px;font-size:.8rem;font-weight:600}
.typegrid input{position:absolute;opacity:0;pointer-events:none}.typegrid label:has(input:checked){border-color:var(--focus);background:#EEF3FF;box-shadow:inset 0 0 0 1px var(--focus)}
.typegrid .ico{width:44px;height:44px;border-radius:12px;background:var(--bg);color:var(--nav)}.typegrid .ico svg{width:26px;height:26px}
.devhead{display:flex;gap:16px;align-items:center}.devhead .ico{width:72px;height:72px;border-radius:20px}.devhead .ico svg{width:40px;height:40px}.devhead .ico.cart .st svg{width:30px;height:30px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media (max-width:560px){.g2{grid-template-columns:1fr}}
.hist{display:grid;gap:8px;margin-top:8px}.hist a{display:flex;gap:10px;justify-content:space-between;text-decoration:none;color:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.9rem}.hist a:hover{background:var(--bg)}
.slips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slip{border:1px dashed #9AA6B8;border-radius:10px;padding:12px 14px;font-size:.9rem;break-inside:avoid}.slip b{font-size:1rem}.slip code{font:600 1rem ui-monospace,Consolas,monospace;background:var(--bg);padding:2px 6px;border-radius:5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--nav);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:100}.toast.on{opacity:1;transform:translateX(-50%)}
footer.ft{color:var(--muted);font-size:.86rem;padding:0 0 30px}
/* ---------- wall display ---------- */
.wall{background:#0E1626;color:#fff;min-height:100vh;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto;padding:3vh 3vw;gap:2.6vh}
.wall .wh{display:flex;align-items:center;gap:1.2vw}.wall .wh img{height:5.4vh}.wall .wh b{font-size:3.4vh}.wall .wh .clk{margin-left:auto;font-size:4.2vh;font-weight:700;font-variant-numeric:tabular-nums}
.wall .wc{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw}.wall .wc div{background:#18233A;border-radius:1.8vh;padding:2.2vh 1.6vw}.wall .wc b{display:block;font-size:7.5vh;line-height:1}.wall .wc span{font-size:2.3vh;color:#A9B8D2}
.wall .c-down b{color:#FF7B72}.wall .c-issue b{color:#F7C15A}.wall .c-repair b{color:#7FA8FF}.wall .c-ok b{color:#4CD69A}
.wall .wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(40vh,1fr));gap:1.6vh;align-content:start;overflow:hidden}
.wall .wi{background:#18233A;border-radius:1.8vh;padding:1.8vh 1.4vw;display:flex;gap:1.2vw;align-items:center;border-left:.9vh solid #F7C15A}.wall .wi.t-down{border-left-color:#FF7B72}.wall .wi.t-repair{border-left-color:#7FA8FF}
.wall .wi .ico{width:7.4vh;height:7.4vh;border-radius:2vh}.wall .wi .ico svg{width:4.4vh;height:4.4vh}.wall .wi .ico.cart .st svg{width:3.6vh;height:3.6vh}
.wall .wi b{font-size:2.9vh;display:block;line-height:1.15}.wall .wi span{font-size:2.2vh;color:#C8D3E6}.wall .wi p{margin:.5vh 0 0;font-size:1.9vh;color:#A9B8D2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wall .good{grid-column:1/-1;display:grid;place-items:center;font-size:5vh;font-weight:700;color:#4CD69A}
.wall .wf{display:flex;justify-content:space-between;color:#7F90AE;font-size:1.9vh}
@media print{header.top,footer.ft,.noprint{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
main.in{padding-top:26px;padding-bottom:60px}
.btn svg{width:18px;height:18px;flex:none}.btn.sm svg{width:16px;height:16px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn.dk[disabled]{opacity:1}
.wall .wi.t-down .ico{background:rgba(224,67,58,.18);color:#FF8A82}.wall .wi.t-issue .ico{background:rgba(209,138,15,.2);color:#FFC759}.wall .wi.t-repair .ico{background:rgba(47,111,235,.22);color:#8FB3FF}
dialog{overflow-x:hidden}

</style>
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div id="app" hidden>
<header class="top"><div class="in">
 <a href="#/" aria-label="Board home"><img src="assets/logo-mark-white.png" alt="Davis Tech Support"></a>
 <div id="sch" class="sch"></div>
 <nav class="tabs" id="tabs" aria-label="Main"></nav>
 <span class="sp"></span>
 <button class="btn red sm" type="button" id="repTop">Report a problem</button>
 <div class="me"><button class="btn sm" type="button" id="meBtn" aria-haspopup="menu"></button>
  <div class="menu" id="meMenu" role="menu"><div class="who" id="meWho"></div><button type="button" id="mPw" role="menuitem">Change my password</button><button type="button" id="mOut" role="menuitem">Sign out</button></div></div>

 bindForm($("#fRoom"),async fd=>{if(!String(fd.get("name")).trim())throw{msg:"Name the room."};if(r)await act("editRoom",{room:r.id,name:fd.get("name"),area:fd.get("area")},"Saved");else await act("addRoom",{name:fd.get("name"),area:fd.get("area"),devices:fd.getAll("dev")},"Room added");d.close()});
 if($("#rDel"))$("#rDel").onclick=async()=>{if(!confirm(`Delete ${r.name}, its devices, and its tickets?`))return;await act("delRoom",{room:r.id},"Room deleted");d.close()}}
/* ===================== PEOPLE ===================== */
function roomPicker(sel){return`<div class="typegrid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${S.board.rooms.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).map(r=>`<label style="flex-direction:row;justify-content:flex-start;padding:9px 10px"><input type="checkbox" name="rooms" value="${r.id}" ${sel.includes(r.id)?"checked":""} style="position:static;opacity:1;pointer-events:auto;width:16px;height:16px">${esc(r.name)}</label>`).join("")||'<p class="hint">Add rooms on the Board first.</p>'}</div>`}
function peopleView(v){if(!isAdmin()){v.innerHTML=`<div class="empty">Only an admin can manage accounts.</div>`;return}
 const us=S.users.slice().sort((a,b)=>(a.disabled-b.disabled)||a.name.localeCompare(b.name));
 v.innerHTML=`<div class="ph"><div><h1>People</h1><p>Give each teacher an account and their room. They choose their own password the first time they sign in.</p></div><div class="tools" style="margin:0"><button class="btn" type="button" id="bulk">${ui("users")} Add many at once</button><button class="btn dk" type="button" id="addP">${ui("plus")} Add a person</button></div></div>
 <div class="card" style="overflow-x:auto"><table class="t"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Rooms</th><th>Last signed in</th><th></th></tr></thead><tbody>
 ${us.map(u=>`<tr class="${u.disabled?"off":""}"><td><b>${esc(u.name)}</b>${u.mustChange?`<div class="hint" style="margin:0">Hasn't set a password yet</div>`:""}${u.disabled?`<div class="hint" style="margin:0">Turned off</div>`:""}</td><td>${esc(u.username)}</td><td><span class="role ${u.role}">${ROLE[u.role]}</span></td><td>${esc(u.rooms.map(id=>(room(id)||{}).name).filter(Boolean).join(", "))||'<span class="hint">None</span>'}</td><td>${u.lastLogin?ago(u.lastLogin):'<span class="hint">Never</span>'}</td><td><button class="btn sm" type="button" data-u="${esc(u.username)}">Edit</button></td></tr>`).join("")}</tbody></table></div>
 <div class="card pad" style="margin-top:18px"><h3 style="margin:0 0 6px">Wall display links</h3><p class="hint" style="margin-top:0">A private link for a TV in the office. It shows problems in big type and needs no sign-in. Anyone with the link can see the board, so only put it on screens you control.</p>
  <div id="disp">${(S.displays||[]).map(x=>`<div class="row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)"><b style="min-width:140px">${esc(x.name)}</b><code style="flex:1;min-width:200px;font-size:.8rem;word-break:break-all;color:var(--muted)">${esc(dispUrl(x.key))}</code><button class="btn sm" type="button" data-copy="${esc(dispUrl(x.key))}">${ui("copy")} Copy</button><a class="btn sm" href="${esc(dispUrl(x.key))}" target="_blank" rel="noopener">Open</a><button class="btn sm" type="button" data-deld="${x.id}">${ui("trash")}</button></div>`).join("")||'<p class="hint">No display links yet.</p>'}</div>
  <form id="fDisp" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><label class="sr" for="dispName">Display name</label><input id="dispName" name="n" placeholder="Front office TV" style="max-width:280px"><button class="btn" type="submit">${ui("tv")} Make a display link</button></form></div>`;
 $$("[data-u]",v).forEach(b=>b.onclick=()=>personForm(S.users.find(u=>u.username===b.dataset.u)));$("#addP").onclick=()=>personForm();$("#bulk").onclick=bulkForm;
 $$("[data-copy]",v).forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast("Link copied")}catch(e){prompt("Copy this link:",b.dataset.copy)}});
 $$("[data-deld]",v).forEach(b=>b.onclick=async()=>{if(confirm("Remove this display link? Screens using it will stop updating."))await act("deleteDisplay",{id:b.dataset.deld},"Removed")});
 bindForm($("#fDisp"),async fd=>{await act("addDisplay",{name:fd.get("n")},"Display link made")})}
const dispUrl=k=>location.origin+location.pathname.replace(/index\.html$/,"")+"?display="+encodeURIComponent(k);
function personForm(u){const d=dlg(`<form class="dlg" id="fP" novalidate><h2>${u?esc(u.name):"Add a person"}</h2>
  <div class="g2"><div><label class="l" for="pn">Full name</label><input id="pn" name="name" maxlength="60" required value="${esc(u?u.name:"")}" placeholder="Jane Allen"></div>
  <div><label class="l" for="pu">Username</label><input id="pu" name="username" maxlength="32" autocapitalize="none" spellcheck="false" ${u?"disabled":""} value="${esc(u?u.username:"")}" placeholder="jallen"></div></div>
  <label class="l" for="pr">Role</label><select id="pr" name="role">${Object.entries(ROLE).map(([k,n])=>`<option value="${k}" ${(u?u.role:"teacher")===k?"selected":""}>${n}${k==="admin"?" (everything, including accounts)":k==="tech"?" (rooms, devices, and tickets)":" (reports and their room)"}</option>`).join("")}</select>
  <label class="l">Rooms</label>${roomPicker(u?u.rooms:[])}
  <p class="err" role="alert"></p>
  <div class="foot">${u?`<button class="btn" type="button" id="pReset" style="margin-right:auto">${ui("key")} Reset password</button><button class="btn" type="button" id="pOff">${u.disabled?"Turn on":"Turn off"}</button><button class="btn" type="button" id="pDel" style="color:var(--down)">${ui("trash")}</button>`:""}<button class="btn" type="button" data-close>Cancel</button><button class="btn dk" type="submit">${u?"Save":"Create account"}</button></div></form>`,"wide");
 const nm=$("#pn"),un=$("#pu");if(!u)nm.addEventListener("input",()=>{if(un.dataset.touched)return;const p=nm.value.trim().toLowerCase().split(/\s+/);un.value=p.length>1?(p[0][0]+p[p.length-1]).replace(/[^a-z0-9]/g,""):(p[0]||"").replace(/[^a-z0-9]/g,"")});un.addEventListener("input",()=>un.dataset.touched=1);
 bindForm($("#fP"),async fd=>{const rooms=fd.getAll("rooms");
  if(u){await act("updateUser",{username:u.username,name:fd.get("name"),role:fd.get("role"),rooms},"Saved");d.close()}
  else{if(!String(fd.get("name")).trim()||!String(fd.get("username")).trim())throw{msg:"Fill in a name and a username."};const j=await act("createUsers",{users:[{name:fd.get("name"),username:fd.get("username"),role:fd.get("role"),rooms}]});showSlips(j.created,"Account created")}});
 if(u){$("#pReset").onclick=async()=>{if(!confirm(`Give ${u.name} a new temporary password? Their current password stops working.`))return;const j=await act("resetPassword",{username:u.username});showSlips(j.created,"New temporary password")};
  $("#pOff").onclick=async()=>{await act("updateUser",{username:u.username,disabled:!u.disabled},u.disabled?"Turned on":"Turned off");d.close()};
  $("#pDel").onclick=async()=>{if(!confirm(`Delete ${u.name}'s account? Their tickets stay on the board.`))return;await act("deleteUser",{username:u.username},"Deleted");d.close()}}}
function bulkForm(){const d=dlg(`<form class="dlg" id="fB" novalidate><h2>Add many people at once</h2><p class="hint" style="margin-top:0">One person per line: <b>name, room</b>. Add a username or role if you like: <b>name, room, username, role</b>. Rooms are matched by name, and usernames are made from the name when left out. Separate several rooms with a slash, like <b>Room 101/Room 102</b>.</p>
  <label class="l" for="bt">People</label><textarea id="bt" name="t" style="min-height:200px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem" placeholder="Jane Allen, Room 112\nMark Lee, Room 114\nSara Ortiz, Library, sortiz\nTom Price, , tprice, tech"></textarea>
  <div id="bPrev" class="hint"></div><p class="err" role="alert"></p><div class="foot"><button class="btn" type="button" data-close>Cancel</button><button class="btn dk" type="submit">Create accounts</button></div></form>`,"wide");
 const parse=()=>{const taken=new Set(S.users.map(u=>u.username));const rows=[],probs=[];
  $("#bt").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const [name,rms,user,role]=l.split(/\s*[,\t]\s*/);if(!name){probs.push(`Line ${i+1} has no name.`);return}
   const rooms=[];String(rms||"").split("/").map(s=>s.trim()).filter(Boolean).forEach(rn=>{const r=S.board.rooms.find(x=>x.name.toLowerCase()===rn.toLowerCase());if(r)rooms.push(r.id);else probs.push(`Line ${i+1}: no room named “${rn}”.`)});
   const p=name.toLowerCase().split(/\s+/);let un=(user||(p.length>1?p[0][0]+p[p.length-1]:p[0])).toLowerCase().replace(/[^a-z0-9._-]/g,"");let base=un,k=2;while(taken.has(un))un=base+k++;taken.add(un);
   const rl=String(role||"teacher").toLowerCase();rows.push({name,username:un,rooms,role:["admin","tech","teacher"].includes(rl)?rl:"teacher"})});return{rows,probs}};
 $("#bt").oninput=()=>{const {rows,probs}=parse();$("#bPrev").innerHTML=rows.length?`${rows.length} account${rows.length>1?"s":""}: ${rows.slice(0,6).map(r=>`${esc(r.name)} (${esc(r.username)})`).join(", ")}${rows.length>6?", …":""}${probs.length?`<br><span style="color:var(--down)">${probs.map(esc).join("<br>")}</span>`:""}`:""};
 bindForm($("#fB"),async()=>{const {rows,probs}=parse();if(!rows.length)throw{msg:"Add at least one person."};if(probs.length)throw{msg:"Fix the lines in red first."};const j=await act("createUsers",{users:rows});showSlips(j.created,`${j.created.length} accounts created`)})}
function showSlips(list,title){const url=location.origin+location.pathname.replace(/index\.html$/,"");
 const d=dlg(`<div class="dlg"><h2>${esc(title)}</h2><p class="hint" style="margin-top:0">Write these down or print them now. Temporary passwords can't be shown again. Each person picks their own password the first time they sign in.</p>
  <div class="slips" id="slips">${list.map(c=>`<div class="slip"><b>${esc(c.name)}</b><br>Go to: ${esc(url)}<br>Username: <code>${esc(c.username)}</code><br>Temporary password: <code>${esc(c.password)}</code></div>`).join("")}</div>
  <div class="foot"><button class="btn" type="button" id="cpS">${ui("copy")} Copy all</button><button class="btn" type="button" id="prS">${ui("print")} Print login slips</button><button class="btn dk" type="button" data-close>Done</button></div></div>`,"wide");
 $("#cpS").onclick=async()=>{const t=list.map(c=>`${c.name}\t${c.username}\t${c.password}`).join("\n");try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){prompt("Copy:",t)}};
 $("#prS").onclick=()=>{const w=window.open("","_blank");if(!w){toast("Allow pop-ups to print");return}w.document.write(`<!doctype html><title>Login slips</title><style>body{font:14px system-ui,sans-serif;margin:12mm}.g{display:grid;grid-template-columns:1fr 1fr;gap:6mm}.s{border:1px dashed #888;border-radius:6px;padding:5mm;break-inside:avoid}.s img{height:28px;float:right}.s b{font-size:16px}code{font:600 15px ui-monospace,Consolas,monospace;background:#f1f3f6;padding:1px 5px;border-radius:4px}p{margin:3px 0}</style><div class="g">${list.map(c=>`<div class="s"><img src="${location.origin+location.pathname.replace(/index\.html$/,"")}assets/logo-mark.png" alt=""><b>${esc(c.name)}</b><p>Room Tech Status${S.board.school?" · "+esc(S.board.school):""}</p><p>Go to: <b>${esc(url)}</b></p><p>Username: <code>${esc(c.username)}</code></p><p>Temporary password: <code>${esc(c.password)}</code></p><p style="color:#666;font-size:12px">You'll choose your own password when you first sign in.</p></div>`).join("")}</div><script>onload=()=>{print()}<\/script>`);w.document.close()}}
/* ===================== ACTIVITY ===================== */
function activityView(v){if(!isManager()){v.innerHTML="";return}
 v.innerHTML=`<div class="ph"><div><h1>Activity</h1><p>The latest changes on the board, newest first.</p></div></div><div class="card" style="overflow-x:auto"><table class="t"><tbody>${(S.log||[]).map(l=>`<tr><td style="white-space:nowrap;color:var(--muted)">${when(l.ts)}</td><td><b>${esc(nameOf(l.by))}</b></td><td>${esc(l.text)}</td></tr>`).join("")||'<tr><td class="hint">Nothing yet.</td></tr>'}</tbody></table></div>`}
/* ===================== WALL DISPLAY ===================== */
async function wall(key){$("#auth").hidden=true;$("#app").hidden=true;const w=$("#wall");w.hidden=false;let B=null,ok=0;
 async function pull(){try{const r=await fetch(API+"?display="+encodeURIComponent(key),{cache:"no-store"});const j=await r.json();if(!r.ok)throw j;B=j.board;ok=Date.now();draw()}catch(e){if(!B)w.innerHTML=`<div class="good">${esc(e.error||"Can't load the board.")}</div>`}}
 function draw(){const all=B.rooms.flatMap(r=>r.devices.map(d=>({r,d})));const c=k=>all.filter(x=>x.d.status===k).length;const bad=all.filter(x=>x.d.status!=="ok").sort((a,b)=>RANK[b.d.status]-RANK[a.d.status]);
  w.innerHTML=`<div class="wh"><img src="assets/logo-mark-white.png" alt=""><b>${esc(B.school||"Room Tech Status")}</b><span class="clk" id="wClk"></span></div>
  <div class="wc">${[["down","Not working"],["issue","Has a problem"],["repair","Being fixed"],["ok","Working"]].map(([k,n])=>`<div class="c-${k}"><b>${c(k)}</b><span>${n}</span></div>`).join("")}</div>
  <div class="wl">${bad.length?bad.map(({r,d})=>{const t=B.tickets.find(x=>x.device===d.id&&x.state!=="fixed");return`<div class="wi t-${d.status}">${icon(d.type)}<div><b>${esc(r.name)}</b><span>${esc(dName(d))} · ${DS[d.status]}</span>${d.statusNote||t?`<p>${esc(d.statusNote||t.text)}</p>`:""}</div></div>`}).join(""):`<div class="good">✓ All classroom tech is working</div>`}</div>
  <div class="wf"><span>Updated ${new Date(ok).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</span><span>Report problems at ${esc(location.host+location.pathname.replace(/index\.html$/,""))}</span></div>`;tick()}
 const tick=()=>{const e=$("#wClk");if(e)e.textContent=new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})};
 setInterval(tick,1000);await pull();setInterval(pull,20000);
 try{if("wakeLock" in navigator)await navigator.wakeLock.request("screen")}catch(e){}}
/* ===================== BOOT ===================== */
window.RSB={get S(){return S}};
const dk=new URLSearchParams(location.search).get("display");
(async()=>{if(dk)return wall(dk);
 if(location.protocol==="file:"){authShell(`<div class="banner bad">This board needs its Netlify server function, so it can't run from a file on your computer. Deploy it to Netlify and open the site address.</div>`);return}
 if(tok){try{const j=await api("me");if(j.me.mustChange){S={me:j.me};return auth("change")}return start()}catch(e){if(e.mustChange)return;if(e.nofn||e.net||e.setup)return authShell(`<div class="banner bad">${esc(e.msg)}</div>`)}}
 try{const st=await api("status");auth(st.needsSetup?"setup":"login")}catch(e){authShell(`<div class="banner bad">${esc(e.msg)}${e.setup?"<br><br>In Netlify, go to Site configuration > Environment variables, add ADMIN_PIN, then redeploy.":""}</div>`)}})();
setInterval(async()=>{if(S&&S.board&&!document.hidden&&!$("#dlg").open&&!document.activeElement.matches("textarea,input")){if(await load(true))route()}},20000);
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&S&&S.board&&!$("#dlg").open){if(await load(true))route()}});
if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
